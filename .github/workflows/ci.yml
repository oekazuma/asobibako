name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Prettier check & ESLint & markuplint
        run: pnpm lint
      - name: Run svelte-vitals
        run: pnpm vitals --reporter console

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run svelte-check
        run: pnpm check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Vitest
        run: pnpm test:run

  # 手元の Mac（arm64）と CI（x64）で浮動小数の最後の 1 ビットが違い、長いシミュのテストが片方でだけ落ちたことがある。
  # 両方の結果を PR に並べる。必須のチェックの名前（test）を変えないよう、matrix にせず別のジョブにする
  test-arm64:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Vitest
        run: pnpm test:run

  build:
    # main への push は deploy.yml がビルドするので、ここでは PR だけ
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - name: Run Build
        run: pnpm build
