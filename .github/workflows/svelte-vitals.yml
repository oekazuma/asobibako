name: svelte-vitals

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  svelte-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # svelte-vitals.config.ts が svelte-vitals を import するので node_modules が要る
      - name: Setup Node.js and dependencies
        uses: ./.github/workflows/setup-node
      - uses: oekazuma/svelte-vitals-action@91ef310a72272f7473aeadcdec63c9ba1ba6ea11 # v0.12.1
        with:
          diff: origin/${{ github.base_ref }}
          baseline: origin/${{ github.base_ref }}
